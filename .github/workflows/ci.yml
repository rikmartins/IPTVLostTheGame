name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build Android release (telemóvel e TV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Em release, como no workflow de release: há verificações que só
      # correm aí (ex.: checkReleaseAarMetadata). Sem a chave do GitHub
      # assina com a de debug.
      - name: Build
        run: |
          set -o pipefail
          for flavor in mobile tv; do
            flutter build apk --release --flavor "$flavor" \
              --target-platform android-arm,android-arm64 2>&1 | tee -a build.log
          done
      # Os logs só se veem com sessão iniciada; a anotação é pública.
      - name: Erro do build no resumo
        if: failure()
        run: bash .github/scripts/annotate-build-error.sh build.log "Build Android falhou"

  # Os mesmos instaladores da release (.exe e .msi), sem publicar: assim um
  # problema no Inno Setup ou no WiX aparece aqui e não numa tag.
  windows:
    name: Instaladores Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release \
            --build-name="0.0.${{ github.run_number }}" 2>&1 | tee build.log
      - name: Instaladores (.exe e .msi)
        shell: pwsh
        run: |
          pwsh -NoProfile -File windows/installer/build-installers.ps1 -Version "0.0.${{ github.run_number }}" *> installers.log
          $code = $LASTEXITCODE
          Get-Content installers.log
          exit $code
      - name: Erro do build no resumo
        if: failure()
        shell: bash
        run: |
          log=build.log
          [ -s installers.log ] && log=installers.log
          bash .github/scripts/annotate-build-error.sh "$log" "Build Windows falhou"
