name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build Android (telemóvel e TV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: |
          set -o pipefail
          for flavor in mobile tv; do
            flutter build apk --debug --flavor "$flavor" 2>&1 | tee -a build.log
          done
      # Os logs só se veem com sessão iniciada; a anotação é pública.
      - name: Erro do build no resumo
        if: failure()
        run: bash .github/scripts/annotate-build-error.sh build.log "Build Android falhou"
