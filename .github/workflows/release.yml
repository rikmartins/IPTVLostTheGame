# Publica uma release a cada tag vX.Y.Z:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Cada release tem sempre os quatro ficheiros, ou não é publicada:
#   IPTV-X.Y.Z-android.apk      telemóveis e tablets
#   IPTV-X.Y.Z-android-tv.apk   Android TV
#   IPTV-Setup-X.Y.Z.exe        Windows, por utilizador (atualiza sem UAC)
#   IPTV-X.Y.Z-windows.msi      Windows, para todos os utilizadores
#
# A versão da app vem da tag (não é preciso mexer no pubspec) e o número de
# build do número da execução, que só sobe: o Android exige versionCode
# crescente para aceitar a atualização.
#
# Tags com hífen (v0.2.0-beta.1) saem como pré-release: o
# `releases/latest` que a app consulta ignora-as, por isso servem para testar
# sem chegar aos utilizadores.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  android:
    name: APKs Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # VERSION vai nos nomes dos ficheiros; BUILD_NAME (só números) na app.
      - name: Versão a partir da tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NAME=${VERSION%%-*}" >> "$GITHUB_ENV"

      # Sem a chave real o build pára: um APK assinado com outra chave não
      # atualiza a app instalada e obrigaria os utilizadores a desinstalar.
      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltam os secrets ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD (ver tool/setup_android_signing.ps1)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.p12
          {
            echo "storeFile=upload-keystore.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
          } > android/key.properties

      - run: flutter pub get

      # Duas variantes (telemóvel e TV), cada uma num só APK ARM 32+64 bits:
      # quem o descarrega à mão na TV não tem de saber a arquitetura.
      - name: Build
        run: |
          set -o pipefail
          for flavor in mobile tv; do
            flutter build apk --release --flavor "$flavor" \
              --target-platform android-arm,android-arm64 \
              --build-name="$BUILD_NAME" \
              --build-number="${{ github.run_number }}" 2>&1 | tee -a build.log
          done

      - name: Erro do build no resumo
        if: failure()
        run: bash .github/scripts/annotate-build-error.sh build.log "Build Android falhou"

      # Os nomes são o que o atualizador da app procura (ver pickAsset).
      - name: Nomes finais
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-mobile-release.apk "dist/IPTV-$VERSION-android.apk"
          cp build/app/outputs/flutter-apk/app-tv-release.apk "dist/IPTV-$VERSION-android-tv.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Instaladores Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Versão a partir da tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NAME=${VERSION%%-*}" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release \
            --build-name="$BUILD_NAME" \
            --build-number="${{ github.run_number }}" 2>&1 | tee build.log

      - name: Instaladores (.exe e .msi)
        shell: pwsh
        run: |
          pwsh -NoProfile -File windows/installer/build-installers.ps1 -Version $env:VERSION *> installers.log
          $code = $LASTEXITCODE
          Get-Content installers.log
          exit $code

      - name: Erro do build no resumo
        if: failure()
        shell: bash
        run: |
          log=build.log
          [ -s installers.log ] && log=installers.log
          bash .github/scripts/annotate-build-error.sh "$log" "Build Windows falhou"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            build/installer/*.exe
            build/installer/*.msi
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Confirmar os quatro ficheiros
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for file in \
            "IPTV-$VERSION-android.apk" \
            "IPTV-$VERSION-android-tv.apk" \
            "IPTV-Setup-$VERSION.exe" \
            "IPTV-$VERSION-windows.msi"; do
            if [ ! -f "dist/$file" ]; then
              echo "::error::Falta $file: a release não é publicada incompleta."
              exit 1
            fi
          done
          ls -l dist

      - uses: softprops/action-gh-release@v3
        with:
          name: Lost the Game ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
